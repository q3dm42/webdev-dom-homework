<!doctype html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link
      rel="icon"
      href="/webdev-dom-homework/favicon.ico"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <div class="loading-message">Комментарии загружаются...</div>

      <!-- рендеринг комментариев из JS -->
      <ul class="comments"></ul>

      <!-- форма ввода нового комментария -->
      <form class="add-form" style="display: none">
        <!-- имя -->
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
          readonly
        />
        <!-- поле ввода комментария -->
        <textarea
          class="add-form-text"
          placeholder="Введите ваш комментарий"
          rows="4"
        ></textarea>
        <!-- сообщение о добавлении комментария -->
        <div class="adding-message">Комментарий добавляется...</div>
        <div class="add-form-row">
          <button class="add-form-button" type="submit">Написать</button>
        </div>
      </form>
    </div>

    <script type="module" src="modules/main.js"></script>
  </body>
</html>
